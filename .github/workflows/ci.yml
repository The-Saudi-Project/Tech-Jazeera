name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  client:
    name: Build Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
          
      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Lint client
        working-directory: ./client
        run: npm run lint

      - name: Build client
        working-directory: ./client
        run: npm run build

  server:
    name: Test Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Lint server
        working-directory: ./server
        run: npm run lint

      - name: Run server tests
        working-directory: ./server
        # A real MongoDB binary (mongodb-memory-server) — no mocked database,
        # matching this project's own testing discipline. NODE_ENV is forced
        # to 'development' by vitest.config.js's own `test.env`; MONGODB_URI
        # here only satisfies env.js's startup check — the test suite never
        # actually connects to it (test/setup.js connects its own in-memory
        # instance instead).
        env:
          NODE_ENV: development
          PORT: '5000'
          MONGODB_URI: mongodb://unused-in-tests/placeholder
          JWT_ACCESS_SECRET: ci-only-placeholder-secret-not-used-in-prod-00000000
          JWT_REFRESH_SECRET: ci-only-placeholder-secret-not-used-in-prod-00000001
          CLIENT_URL: http://localhost:5173
          UPLOAD_DIR: ./uploads
          CLOUDINARY_CLOUD_NAME: ci-placeholder
          CLOUDINARY_API_KEY: ci-placeholder
          CLOUDINARY_API_SECRET: ci-placeholder
        run: npm test

name: Deploy to Oracle Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            # Navigate to the backend folder
            cd ~/Tech-Jazeera-Backend
            
            # Pull the latest code from the main branch
            git pull origin main
            
            # Go into the server folder and install any new dependencies
            cd server
            npm install
            
            # Restart the Node server cleanly
            pm2 restart aljazeera-backend
            pm2 save
